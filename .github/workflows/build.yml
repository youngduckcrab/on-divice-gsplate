name: build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine tests (lavapipe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan software driver and glslc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan-dev glslc ninja-build zlib1g-dev
      - name: Build
        run: |
          cmake -S engine -B build/engine -G Ninja -DCMAKE_BUILD_TYPE=Release -DGS_BUILD_TESTS=ON
          cmake --build build/engine
      - name: Test
        run: ctest --test-dir build/engine --output-on-failure

  # Builds the APK and, the first time a version from version.properties builds
  # green, publishes it as a GitHub release. The APK goes straight to the release
  # rather than through workflow artifacts (the account's artifact quota is full).
  android:
    name: Android APK
    needs: engine-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew --no-daemon --continue assembleRelease
      - name: Rename APK
        id: apk
        run: |
          version=$(grep '^versionName=' version.properties | cut -d= -f2)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/gsplat-v${version}.apk"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ls -l dist
      - name: Publish release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; bump version.properties to publish a new build."
            exit 0
          fi
          notes="docs/releases/${tag}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing release notes $notes"
            exit 1
          fi
          { cat "$notes"; echo; echo "---"; echo "빌드: \`${GITHUB_SHA::7}\` · CI run #${GITHUB_RUN_NUMBER}"; } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" dist/*.apk --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA"
