name: datasets

# Renders the virtual-capture example datasets (tools/datasets) and attaches
# them to the "datasets-v1" release. Deterministic: the camera paths are seeded
# and the source models are pinned in fetch_assets.sh. Run by hand only: an
# edit to the tools must not republish anything. The body dataset (Mixamo
# "Michelle") is for internal testing and is not published; render it
# locally with make_dataset.py.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datasets
  cancel-in-progress: true

jobs:
  render:
    name: Render virtual captures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan-dev glslc ninja-build \
            zlib1g-dev libegl1 libegl-mesa0 libgl1-mesa-dri ffmpeg
          python -m pip install -r tools/datasets/requirements.txt
      - name: Build gs_render
        run: |
          cmake -S engine -B build/engine -G Ninja -DCMAKE_BUILD_TYPE=Release -DGS_BUILD_TESTS=ON
          cmake --build build/engine --target gs_render
      - name: Fetch source models
        run: tools/datasets/fetch_assets.sh assets
      - name: Render datasets
        working-directory: tools/datasets
        run: |
          out=../../out
          python make_dataset.py head --assets ../../assets --out $out/gsplat-capture-head --zip
          python make_dataset.py lizard --spz ../../assets/hornedlizard.spz \
            --gs-render ../../build/engine/gs_render --out $out/gsplat-capture-lizard --zip
          for s in head lizard; do cp $out/gsplat-capture-$s/preview.mp4 $out/gsplat-capture-$s.mp4; done
          ls -l $out
      - name: Publish to the datasets release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=datasets-v1
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --title "예제 데이터셋 v1 (가상 촬영)" --notes-file docs/datasets.md \
              --target "$GITHUB_SHA" --latest=false
          fi
          gh release upload "$tag" out/*.zip out/*.mp4 --clobber
